name: Gerador Automático de Posts do Blog

on:
  schedule:
    - cron: '0 8 * * 1' # Toda segunda-feira às 08:00 UTC
  workflow_dispatch: # Permite disparar manualmente no GitHub

jobs:
  build-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que o GitHub Actions faça commits no repositório

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install feedparser google-genai

      - name: Executar Agente Gerador
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Fazer Commit e Push do Novo Post
        run: |
          git config --global user.name "Agente Viagem ao Céu Noturno"
          git config --global user.email "actions@github.com"
          git add content/blog/
          git commit -m "🤖 Novo post gerado automaticamente pelo agente Gemini"
          git push