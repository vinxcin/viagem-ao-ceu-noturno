name: Sugerir Novo Post (Pull Request)

on:
  schedule:
    - cron: '0 8 * * 1' # Toda segunda-feira às 08:00 UTC
  workflow_dispatch: # Permite disparar manualmente no GitHub

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install feedparser google-genai

      - name: Executar Agente Gerador
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Criar Pull Request de Aprovação
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Nova matéria magnética gerada pelo agente"
          title: "✨ Nova Matéria Enriquecida para o Blog"
          body: "Este Pull Request foi gerado pelo agente com foco em engajamento, astrofotografia e etnoastronomia Tupi-Guarani. Revise e aprove!"
          branch: agente-novo-post
          delete-branch: true
          base: main
